# docker compose up --build
#   API:      http://localhost:8000/docs
#   Frontend: npm run dev (http://localhost:5173) — points at the API by default
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: smurfpakad
      POSTGRES_PASSWORD: smurfpakad
      POSTGRES_DB: smurfpakad
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U smurfpakad"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build: .
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://smurfpakad:smurfpakad@db:5432/smurfpakad
      UPLOAD_DIR: /data/uploads
      FRONTEND_URL: http://localhost:5173
      # Optional integrations — leave empty to run in demo mode
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:-}
      IBM_WATSONX_API_KEY: ${IBM_WATSONX_API_KEY:-}
      IBM_WATSONX_PROJECT_ID: ${IBM_WATSONX_PROJECT_ID:-}
      GROQ_API_KEY: ${GROQ_API_KEY:-}
    volumes:
      - uploads:/data/uploads
    ports:
      - "8000:8000"

volumes:
  pgdata:
  uploads:
